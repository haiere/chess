<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Modern Theme</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Board Section -->
        <div class="board-section">
            <div class="board-wrapper" id="boardWrapper">
                <div class="board-container" id="board" role="grid" aria-label="Papan Catur"></div>
            </div>

            <div class="board-controls">
                <button class="btn icon-btn" id="btnFlip" type="button" aria-label="Balik papan" title="Balik Papan">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 5a7 7 0 0 1 7 7h2l-3 3-3-3h2a5 5 0 1 0-5 5v2a7 7 0 0 1 0-14Zm0 14a7 7 0 0 1-7-7H3l3-3 3 3H7a5 5 0 1 0 5-5V5a7 7 0 0 1 0 14Z"/></svg>
                </button>
                <button class="btn" id="btnUndo" type="button" title="Undo" aria-label="Undo langkah">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.5 5C9.46 5 6.73 6.2 4.75 8.15L2 5.4V13h7.6L6.6 10A8 8 0 1 1 4 16h2.2a6 6 0 1 0 6.3-11Z"/></svg>
                    <span>Undo</span>
                </button>
                <button class="btn" id="btnRedo" type="button" title="Redo" aria-label="Redo langkah">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11.5 5A8 8 0 1 1 18 16h2v2h-4.2A8 8 0 0 1 11.5 5Zm0 2a6 6 0 1 0 5.9 7h2.1l-2.75 3L16 14h2a6 6 0 0 0-6.5-7Z"/></svg>
                    <span>Redo</span>
                </button>
                <button class="btn danger" id="btnResign" type="button" title="Resign" aria-label="Menyerah">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 3h10l4 4v14H5V3Zm10 1.5V8h3.5L15 4.5ZM8 12h8v2H8v-2Zm0 4h8v2H8v-2Z"/></svg>
                    <span>Resign</span>
                </button>
                <button class="btn" id="btnDraw" type="button" title="Tawarkan Remis" aria-label="Tawarkan remis">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 21s-7-4.35-7-10a4.5 4.5 0 0 1 8-2.85A4.5 4.5 0 0 1 19 11c0 5.65-7 10-7 10Zm-2.6-12.3a2.5 2.5 0 0 0-2.4 2.3c0 3.4 3.55 6.24 5 7.27 1.45-1.03 5-3.87 5-7.27a2.5 2.5 0 0 0-4.4-1.62l-.6.72-.6-.72A2.5 2.5 0 0 0 9.4 8.7Z"/></svg>
                    <span>Draw</span>
                </button>
                <button class="btn accent" id="btnNewGame" type="button" aria-label="Permainan baru">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
                    <span>New Game</span>
                </button>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="side-panel" id="sidePanel">
            <div class="panel-card">
                <div class="player-header">
                    <div class="player-avatar white" aria-hidden="true">W</div>
                    <div class="player-info">
                        <div class="player-name">White</div>
                        <div class="player-status active" id="whiteStatus">Your turn</div>
                    </div>
                    <div class="player-timer" id="whiteTimer">10:00</div>
                </div>
                <div class="captured-row" id="whiteCaptured"></div>
            </div>

            <div class="panel-card text-center">
                <div id="gameStatusText" class="text-bold">White to move</div>
                <div class="text-sub" id="gameSubStatus"></div>
            </div>

            <div class="panel-card">
                <div class="player-header">
                    <div class="player-avatar black" aria-hidden="true">B</div>
                    <div class="player-info">
                        <div class="player-name">Black</div>
                        <div class="player-status" id="blackStatus">Waiting</div>
                    </div>
                    <div class="player-timer" id="blackTimer">10:00</div>
                </div>
                <div class="captured-row" id="blackCaptured"></div>
            </div>

            <div class="panel-card">
                <div class="history-header">
                    <strong>Move History</strong>
                    <div class="flex-gap-4">
                        <button class="btn small icon-btn" id="btnCopyPGN" type="button" title="Copy PGN" aria-label="Copy PGN">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1Zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H10V7h9v14Z"/></svg>
                        </button>
                        <button class="btn small icon-btn" id="btnDownloadPGN" type="button" title="Download PGN" aria-label="Download PGN">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L11 13.17V3h1Zm-7 16h14v2H5v-2Z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="move-history" id="moveHistory" role="log" aria-label="Riwayat langkah"></div>
            </div>

            <div class="panel-card panel-actions">
                <button class="btn small" id="btnSettings" type="button" aria-label="Settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94s.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.51.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
                    <span>Settings</span>
                </button>
                <button class="btn small" id="btnTheme" type="button" aria-label="Theme">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v1.1A7 7 0 1 1 8.9 6H8a1 1 0 1 1 0-2h1.1A1 1 0 0 1 12 3Zm0 4a5 5 0 1 0 5 5 1 1 0 0 1 1.7-.7l1.3 1.3V10a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-2.6a7 7 0 0 1-7.4 7.4V20a1 1 0 1 1-2 0v-1.1A7 7 0 0 1 12 7Z"/></svg>
                    <span>Theme</span>
                </button>
                <button class="btn small" id="btnImportFEN" type="button" aria-label="Import FEN">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 3h10l4 4v14H5V3Zm10 1.5V8h3.5L15 4.5ZM12 11v5m0 0-2-2m2 2 2-2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Import FEN</span>
                </button>
                <button class="btn small" id="btnExportFEN" type="button" aria-label="Export FEN">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 3h10l4 4v14H5V3Zm10 1.5V8h3.5L15 4.5ZM12 13v-5m0 0-2 2m2-2 2 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>Export FEN</span>
                </button>
                <button class="btn small" id="btnSoundToggle" type="button" aria-label="Sound">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 10v4h4l5 4V6L8 10H4Zm13.5 2a3.5 3.5 0 0 0-1.5-2.9v5.8a3.5 3.5 0 0 0 1.5-2.9Zm2.5 0a6 6 0 0 1-3 5.2v-2.1a4 4 0 0 0 0-6.2V6.8A6 6 0 0 1 20 12Z"/></svg>
                    <span>Sound</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay hidden" id="promotionModal">
        <div class="modal">
            <h2>Choose Promotion</h2>
            <div class="promotion-options" id="promotionOptions"></div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="newGameModal">
        <div class="modal max-w-500">
            <h2>New Game</h2>
            <div class="settings-grid">
                <label for="ngMode">Mode</label>
                <select id="ngMode">
                    <option value="pvp">Player vs Player</option>
                    <option value="pvc">Player vs Computer</option>
                </select>

                <label for="ngColor">Player Color</label>
                <select id="ngColor">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>

                <label for="ngDifficulty">Ai Difficulty level</label>
                <select id="ngDifficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <label for="ngTimer">Mode Timer</label>
                <select id="ngTimer">
                    <option value="10|0">10|0 Rapid</option>
                    <option value="5|3">5|3 Blitz</option>
                    <option value="3|2">3|2 Blitz</option>
                    <option value="1|0">1|0 Bullet</option>
                    <option value="0|0">Tanpa Timer</option>
                </select>

                <label for="ngBoardTheme">Chess board theme</label>
                <select id="ngBoardTheme">
                    <option value="classic">Classic Brown</option>
                    <option value="emerald">Emerald</option>
                    <option value="midnight">Midnight Blue</option>
                    <option value="rose">Rose</option>
                    <option value="bw">Black & White</option>
                    <option value="neon">Neon Cyberpunk</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn accent" id="btnStartGame" type="button" aria-label="Start Game">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 5v14l11-7L8 5Z"/></svg>
                    <span>Start Game</span>
                </button>
                <button class="btn" id="btnCancelNewGame" type="button">Batal</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="gameOverModal">
        <div class="modal">
            <div id="gameOverContent"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
