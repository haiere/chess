<!DOCTYPE html>
<html lang="en" data-theme="dark" data-board-theme="classic">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Online Chess Game - Free Modern Chess Board | Hajir Studio</title>

    <meta name="description"
        content="Play a free online chess game with a modern interface, move history, timers, board themes, FEN import and export, PGN download, and multiple game modes.">
    <meta name="keywords"
        content="online chess game, free chess game, chess board, play chess online, chess PGN, chess FEN, Hajir Studio">
    <meta name="author" content="Hajir Studio">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#111827">

    <link rel="canonical" href="https://hajir.is-a.dev/chess">
    <link rel="icon" href="/favicon.ico">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hajir.is-a.dev/chess">
    <meta property="og:title" content="Online Chess Game - Hajir Studio">
    <meta property="og:description"
        content="Play chess online with timers, move history, board themes, FEN tools, PGN export, and multiple game modes.">
    <meta property="og:site_name" content="Hajir Studio">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Online Chess Game - Hajir Studio">
    <meta name="twitter:description"
        content="A free modern online chess game with useful tools for casual and competitive play.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Online Chess Game",
        "url": "https://hajir.is-a.dev/chess",
        "description": "A free online chess game with timers, move history, board themes, FEN tools, and PGN export.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "author": { "@type": "Person", "name": "Hajir Studio" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
</head>

<body>
    <main class="app-container">
        <section class="board-section" aria-labelledby="gameTitle">
            <h1 id="gameTitle" class="visually-hidden">Online Chess Game</h1>

            <div class="board-wrapper" id="boardWrapper">
                <div class="board-container" id="board" role="grid" aria-label="Chess board"></div>
            </div>

            <nav class="board-controls" aria-label="Chess game controls">
                <button class="btn icon-btn" id="btnFlip" type="button" aria-label="Flip board" title="Flip Board">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M12 5a7 7 0 0 1 7 7h2l-3 3-3-3h2a5 5 0 1 0-5 5v2a7 7 0 0 1 0-14Zm0 14a7 7 0 0 1-7-7H3l3-3 3 3H7a5 5 0 1 0 5-5V5a7 7 0 0 1 0 14Z" />
                    </svg>
                </button>

                <button class="btn" id="btnUndo" type="button" title="Undo last move" aria-label="Undo last move">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M12.5 5C9.46 5 6.73 6.2 4.75 8.15L2 5.4V13h7.6L6.6 10A8 8 0 1 1 4 16h2.2a6 6 0 1 0 6.3-11Z" />
                    </svg>
                    <span>Undo</span>
                </button>

                <button class="btn" id="btnRedo" type="button" title="Redo move" aria-label="Redo move">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M11.5 5A8 8 0 1 1 18 16h2v2h-4.2A8 8 0 0 1 11.5 5Zm0 2a6 6 0 1 0 5.9 7h2.1l-2.75 3L16 14h2a6 6 0 0 0-6.5-7Z" />
                    </svg>
                    <span>Redo</span>
                </button>

                <button class="btn danger" id="btnResign" type="button" title="Resign the game" aria-label="Resign the game">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M5 3h10l4 4v14H5V3Zm10 1.5V8h3.5L15 4.5ZM8 12h8v2H8v-2Zm0 4h8v2H8v-2Z" />
                    </svg>
                    <span>Resign</span>
                </button>

                <button class="btn" id="btnDraw" type="button" title="Offer a draw" aria-label="Offer a draw">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M12 21s-7-4.35-7-10a4.5 4.5 0 0 1 8-2.85A4.5 4.5 0 0 1 19 11c0 5.65-7 10-7 10Zm-2.6-12.3a2.5 2.5 0 0 0-2.4 2.3c0 3.4 3.55 6.24 5 7.27 1.45-1.03 5-3.87 5-7.27a2.5 2.5 0 0 0-4.4-1.62l-.6.72-.6-.72A2.5 2.5 0 0 0 9.4 8.7Z" />
                    </svg>
                    <span>Draw</span>
                </button>

                <button class="btn accent" id="btnNewGame" type="button" aria-label="Start a new game">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z" />
                    </svg>
                    <span>New Game</span>
                </button>
            </nav>
        </section>

        <aside class="side-panel" id="sidePanel" aria-label="Game information">
            <section class="panel-card">
                <div class="player-header">
                    <div class="player-avatar white" aria-hidden="true">W</div>
                    <div class="player-info">
                        <div class="player-name">White</div>
                        <div class="player-status active" id="whiteStatus">Your turn</div>
                    </div>
                    <time class="player-timer" id="whiteTimer">10:00</time>
                </div>
                <div class="captured-row" id="whiteCaptured" aria-label="White captured pieces"></div>
            </section>

            <section class="panel-card text-center" aria-live="polite">
                <div id="gameStatusText" class="text-bold">White to move</div>
                <div class="text-sub" id="gameSubStatus"></div>
            </section>

            <section class="panel-card">
                <div class="player-header">
                    <div class="player-avatar black" aria-hidden="true">B</div>
                    <div class="player-info">
                        <div class="player-name">Black</div>
                        <div class="player-status" id="blackStatus">Waiting</div>
                    </div>
                    <time class="player-timer" id="blackTimer">10:00</time>
                </div>
                <div class="captured-row" id="blackCaptured" aria-label="Black captured pieces"></div>
            </section>

            <section class="panel-card panel-history">
                <div class="history-header">
                    <strong>Move History</strong>
                    <div class="flex-gap-4">
                        <button class="btn small icon-btn" id="btnCopyPGN" type="button" title="Copy PGN" aria-label="Copy PGN">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor"
                                    d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1Zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H10V7h9v14Z" />
                            </svg>
                        </button>
                        <button class="btn small icon-btn" id="btnDownloadPGN" type="button" title="Download PGN" aria-label="Download PGN">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path fill="currentColor"
                                    d="M12 3v10.17l3.59-3.58L17 11l-5 5-5-5 1.41-1.41L11 13.17V3h1Zm-7 16h14v2H5v-2Z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="move-history" id="moveHistory" role="log" aria-label="Move history"></div>
            </section>

            <section class="panel-card panel-actions" aria-label="Game tools">
                <button class="btn small" id="btnSettings" type="button" aria-label="Open settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94s.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.51.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z" />
                    </svg>
                    <span>Settings</span>
                </button>

                <button class="btn small" id="btnTheme" type="button" aria-label="Change theme">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M12 3a1 1 0 0 1 1 1v1.1A7 7 0 1 1 8.9 6H8a1 1 0 1 1 0-2h1.1A1 1 0 0 1 12 3Zm0 4a5 5 0 1 0 5 5 1 1 0 0 1 1.7-.7l1.3 1.3V10a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-2.6a7 7 0 0 1-7.4 7.4V20a1 1 0 1 1-2 0v-1.1A7 7 0 0 1 12 7Z" />
                    </svg>
                    <span>Theme</span>
                </button>

                <button class="btn small" id="btnImportFEN" type="button" aria-label="Import FEN">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M5 3h10l4 4v14H5V3Zm10 1.5V8h3.5L15 4.5ZM12 11v5m0 0-2-2m2 2 2-2"
                            stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Import FEN</span>
                </button>

                <button class="btn small" id="btnExportFEN" type="button" aria-label="Export FEN">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M5 3h10l4 4v14H5V3Zm10 1.5V8h3.5L15 4.5ZM12 13v-5m0 0-2 2m2-2 2 2"
                            stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Export FEN</span>
                </button>

                <button class="btn small active" id="btnSoundToggle" type="button" aria-label="Toggle sound">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor"
                            d="M4 10v4h4l5 4V6L8 10H4Zm13.5 2a3.5 3.5 0 0 0-1.5-2.9v5.8a3.5 3.5 0 0 0 1.5-2.9Zm2.5 0a6 6 0 0 1-3 5.2v-2.1a4 4 0 0 0 0-6.2V6.8A6 6 0 0 1 20 12Z" />
                    </svg>
                    <span>Sound</span>
                </button>

                <a class="btn small accent" href="https://buymeacoffee.com/hajirstudio" target="_blank"
                    rel="noopener noreferrer" aria-label="Support Hajir Studio on Buy Me a Coffee">
                    <span aria-hidden="true">☕</span>
                    <span>Support</span>
                </a>
            </section>
        </aside>
    </main>

    <div class="modal-overlay hidden" id="promotionModal" role="dialog" aria-modal="true"
        aria-labelledby="promotionTitle">
        <div class="modal">
            <h2 id="promotionTitle">Choose Promotion</h2>
            <div class="promotion-options" id="promotionOptions"></div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="newGameModal" role="dialog" aria-modal="true" aria-labelledby="newGameTitle">
        <div class="modal max-w-500">
            <h2 id="newGameTitle">New Game</h2>

            <div class="settings-grid">
                <label for="ngMode">Game Mode</label>
                <select id="ngMode">
                    <option value="pvp">Player vs Player</option>
                    <option value="pvc">Player vs Computer</option>
                </select>

                <label for="ngColor">Player Color</label>
                <select id="ngColor">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>

                <label for="ngDifficulty">AI Difficulty Level</label>
                <select id="ngDifficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <label for="ngTimer">Time Control</label>
                <select id="ngTimer">
                    <option value="10|0">10|0 Rapid</option>
                    <option value="5|3">5|3 Blitz</option>
                    <option value="3|2">3|2 Blitz</option>
                    <option value="1|0">1|0 Bullet</option>
                    <option value="0|0">No Timer</option>
                </select>

                <label for="ngBoardTheme">Chess Board Theme</label>
                <select id="ngBoardTheme">
                    <option value="classic">Classic Brown</option>
                    <option value="emerald">Emerald</option>
                    <option value="midnight">Midnight Blue</option>
                    <option value="rose">Rose</option>
                    <option value="bw">Black and White</option>
                    <option value="neon">Neon Cyberpunk</option>
                </select>
            </div>

            <div class="modal-buttons">
                <button class="btn accent" id="btnStartGame" type="button" aria-label="Start game">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M8 5v14l11-7L8 5Z" />
                    </svg>
                    <span>Start Game</span>
                </button>
                <button class="btn" id="btnCancelNewGame" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="gameOverModal" role="dialog" aria-modal="true"
        aria-labelledby="gameOverTitle">
        <div class="modal">
            <h2 id="gameOverTitle" class="visually-hidden">Game Over</h2>
            <div id="gameOverContent"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
</body>
</html>
