                        const winner = gameState.gameResult === 'white' ? 'Putih' : 'Hitam';
                        statusEl.textContent = `🏆 ${winner} Menang - Checkmate!`;
                    } else if (gameState.isStalemate) {
                        statusEl.textContent = '🤝 Stalemate';
                    } else {
                        statusEl.textContent = '🏁 Game Over';
                    }
                    subEl.textContent = '';
                } else if (gameState.isCheck) {
                    statusEl.textContent = '⚠️ Check!';
                    subEl.textContent = `${gameState.currentPlayer === 'white' ? 'White' : 'Black'} harus melindungi raja`;
                } else {
                    statusEl.textContent = `${gameState.currentPlayer === 'white' ? 'White' : 'Black'} to move`;
                    subEl.textContent = '';
                }
            }

            function updatePlayerStatusUI() {
                const whiteStatus = document.getElementById('whiteStatus');
                const blackStatus = document.getElementById('blackStatus');
                whiteStatus.className = 'player-status';
                blackStatus.className = 'player-status';

                if (gameState.gameOver) {
                    whiteStatus.textContent = 'Game over';
                    blackStatus.textContent = 'Game over';
                } else if (aiThinking && gameState.currentPlayer !== playerColor) {
                    whiteStatus.textContent = gameState.currentPlayer === 'white' ? 'Computer thinking...' : 'Waiting';
                    blackStatus.textContent = gameState.currentPlayer === 'black' ? 'Computer thinking...' : 'Waiting';
                    if (gameState.currentPlayer === 'white') whiteStatus.classList.add('active');
                    else blackStatus.classList.add('active');
                } else {
                    if (gameState.currentPlayer === 'white') {
                        whiteStatus.textContent = 'Your turn';
                        whiteStatus.classList.add('active');
                        blackStatus.textContent = 'Waiting';
                    } else {
                        blackStatus.textContent = 'Your turn';
                        blackStatus.classList.add('active');
                        whiteStatus.textContent = 'Waiting';
                    }
                    if (gameState.isCheck) {
                        if (gameState.currentPlayer === 'white') whiteStatus.classList.add('check-status');
                        else blackStatus.classList.add('check-status');
                    }
                }
            }

            function updateMoveHistoryUI() {
                const container = document.getElementById('moveHistory');
                container.innerHTML = '';
                const history = gameState.moveHistory;
                for (let i = 0; i < history.length; i += 2) {
                    const row = document.createElement('div');
                    row.className = 'move-row';
                    if (currentViewMoveIndex >= 0 && i <= currentViewMoveIndex && (i + 1 > currentViewMoveIndex || i ===
                            currentViewMoveIndex)) {
                        row.classList.add('current');
                    }
                    const numSpan = document.createElement('span');
                    numSpan.className = 'move-number';
                    numSpan.textContent = Math.floor(i / 2) + 1 + '.';
                    row.appendChild(numSpan);
                    const whiteSpan = document.createElement('span');
                    whiteSpan.className = 'move-white';
                    whiteSpan.textContent = history[i]?.notation || '';
                    whiteSpan.addEventListener('click', () => navigateToMove(i));
                    row.appendChild(whiteSpan);
                    const blackSpan = document.createElement('span');
                    blackSpan.className = 'move-black';
                    if (history[i + 1]) {
                        blackSpan.textContent = history[i + 1].notation || '';
                        blackSpan.addEventListener('click', () => navigateToMove(i + 1));
                    }
                    row.appendChild(blackSpan);
                    container.appendChild(row);
                }
                container.scrollTop = container.scrollHeight;
            }

            function updateCapturedUI() {
                const whiteCap = document.getElementById('whiteCaptured');
                const blackCap = document.getElementById('blackCaptured');
                whiteCap.innerHTML = '';
                blackCap.innerHTML = '';

                let whiteMaterial = 0;
                let blackMaterial = 0;
                const values = { pawn: 1, knight: 3, bishop: 3, rook: 5, queen: 9 };

                for (const piece of gameState.capturedPieces.white) {
                    const img = document.createElement('img');
                    img.className = 'captured-piece';
                    img.src = PIECE_ASSETS['white'][piece.type];
                    img.alt = `captured white ${piece.type}`;
                    whiteCap.appendChild(img);
                    whiteMaterial += values[piece.type] || 0;
                }
                for (const piece of gameState.capturedPieces.black) {
                    const img = document.createElement('img');
                    img.className = 'captured-piece';
                    img.src = PIECE_ASSETS['black'][piece.type];
                    img.alt = `captured black ${piece.type}`;
                    blackCap.appendChild(img);
                    blackMaterial += values[piece.type] || 0;
                }
                if (whiteMaterial > blackMaterial) {
                    const adv = document.createElement('span');
                    adv.className = 'material-advantage';
                    adv.textContent = `+${whiteMaterial - blackMaterial}`;
                    whiteCap.appendChild(adv);
                }
                if (blackMaterial > whiteMaterial) {
                    const adv = document.createElement('span');
                    adv.className = 'material-advantage';
                    adv.textContent = `+${blackMaterial - whiteMaterial}`;
                    blackCap.appendChild(adv);
                }
            }

            function updateTimerUI() {
                const formatTime = (s) => {
                    if (s <= 0) return '0:00';
                    const min = Math.floor(s / 60);
                    const sec = Math.floor(s % 60);
                    return `${min}:${sec.toString().padStart(2, '0')}`;
                };
                document.getElementById('whiteTimer').textContent = formatTime(Math.max(0, Math.floor(timers.white)));
                document.getElementById('blackTimer').textContent = formatTime(Math.max(0, Math.floor(timers.black)));
                if (timers.white <= 10) document.getElementById('whiteTimer').classList.add('low-time');
                else document.getElementById('whiteTimer').classList.remove('low-time');
                if (timers.black <= 10) document.getElementById('blackTimer').classList.add('low-time');
                else document.getElementById('blackTimer').classList.remove('low-time');
            }

            // ========== TIMER ==========
            function startTimer() {
                stopTimer();
                if (timerMode.initial <= 0) return;
                timerRunning = true;
                timerInterval = setInterval(() => {
                    if (gameState.gameOver || !timerRunning) return;
                    const active = gameState.currentPlayer;
                    if (active === 'white') timers.white -= 0.1;
                    else timers.black -= 0.1;
                    if (timers.white <= 0) { timers.white = 0;
                        handleTimeout('white'); }
                    if (timers.black <= 0) { timers.black = 0;
                        handleTimeout('black'); }
                    updateTimerUI();
                }, 100);
            }

            function stopTimer() {
                timerRunning = false;
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
            }

            function handleTimeout(color) {
                stopTimer();
                const opponent = color === 'white' ? 'black' : 'white';
                // Check if opponent has sufficient material
                const oppMoves = getAllLegalMovesForColor(gameState.board, opponent, gameState.castlingRights, gameState
                    .enPassantTarget);
                if (oppMoves.length === 0) {
                    gameState.gameOver = true;
                    gameState.gameResult = 'draw';
                } else {
                    gameState.gameOver = true;
                    gameState.gameResult = opponent;
                }
                updateGameStatus();
                renderBoard();
                updatePlayerStatusUI();
                handleGameOver();
            }

            // ========== PGN ==========
            function exportPGN() {
                let pgn = '';
                pgn += '[Event "Casual Game"]\n';
                pgn += '[Site "Chess Modern Web"]\n';
                pgn += '[Date "' + new Date().toISOString().split('T')[0] + '"]\n';
                pgn += '[Round "1"]\n';
                pgn += '[White "Player White"]\n';
                pgn += '[Black "Player Black"]\n';
                const resultMap = { white: '1-0', black: '0-1', draw: '1/2-1/2' };
                pgn += '[Result "' + (resultMap[gameState.gameResult] || '*') + '"]\n\n';
                for (let i = 0; i < gameState.moveHistory.length; i++) {
                    if (i % 2 === 0) pgn += Math.floor(i / 2 + 1) + '. ';
                    pgn += gameState.moveHistory[i].notation + ' ';
                }
                pgn += (resultMap[gameState.gameResult] || '*');
                return pgn.trim();
            }

            function copyPGN() {
                const pgn = exportPGN();
                navigator.clipboard.writeText(pgn).then(() => showToast('PGN berhasil disalin!', 'success')).catch(() =>
                    showToast('Gagal menyalin PGN', 'error'));
            }

            function downloadPGN() {
                const pgn = exportPGN();
                const blob = new Blob([pgn], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'game.pgn';
                a.click();
                URL.revokeObjectURL(url);
            }

            // ========== STORAGE ==========
            function saveGameToStorage() {
                try {
                    const data = {
                        fen: exportFEN(),
                        moveHistory: gameState.moveHistory,
                        gameMode,
                        playerColor,
                        aiDifficulty,
                        timerMode,
                        timers,
                        boardTheme,
                        boardOrientation,
                    };
                    localStorage.setItem('chess-game-save', JSON.stringify(data));
                } catch (e) { /* ignore */ }
            }

            function loadGameFromStorage() {
                try {
                    const raw = localStorage.getItem('chess-game-save');
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (data.fen) loadFromFEN(data.fen);
                    if (data.moveHistory) gameState.moveHistory = data.moveHistory;
                    if (data.gameMode) gameMode = data.gameMode;
                    if (data.playerColor) playerColor = data.playerColor;
                    if (data.aiDifficulty) aiDifficulty = data.aiDifficulty;
                    if (data.timerMode) { timerMode = data.timerMode;
                        timers = data.timers || { white: timerMode.initial, black: timerMode.initial }; }
                    if (data.boardTheme) { boardTheme = data.boardTheme;
                        document.body.setAttribute('data-board-theme', boardTheme); }
                    if (data.boardOrientation) boardOrientation = data.boardOrientation;
                    updateCheckStatus();
                    updateGameStatus();
                    renderBoard();
                    updateMoveHistoryUI();
                    updateCapturedUI();
                    updatePlayerStatusUI();
                    updateTimerUI();
                    if (timerMode.initial > 0 && !gameState.gameOver) startTimer();
                    return true;
                } catch (e) { return false; }
            }

            function loadSettings() {
                try {
                    const raw = localStorage.getItem('chess-settings');
                    if (!raw) return;
                    const settings = JSON.parse(raw);
                    if (settings.soundEnabled !== undefined) soundEnabled = settings.soundEnabled;
                    if (settings.soundVolume !== undefined) soundVolume = settings.soundVolume;
                    if (settings.boardTheme) {
                        boardTheme = settings.boardTheme;
                        document.body.setAttribute('data-board-theme', boardTheme);
                    }
                    if (settings.theme) document.documentElement.setAttribute('data-theme', settings.theme);
                    if (settings.showCoordinates !== undefined) showCoordinates = settings.showCoordinates;
                    updateSoundButton();
                } catch (e) { /* ignore */ }
            }

            function saveSettings() {
                try {
                    const settings = {
                        soundEnabled,
                        soundVolume,
                        boardTheme,
                        theme: document.documentElement.getAttribute('data-theme'),
                        showCoordinates,
                    };
                    localStorage.setItem('chess-settings', JSON.stringify(settings));
                } catch (e) { /* ignore */ }
            }

            // ========== TOAST ==========
            function showToast(message, type = '') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 2600);
            }

            // ========== MODAL HANDLERS ==========
            function showNewGameModal() {
                document.getElementById('newGameModal').classList.remove('hidden');
                document.getElementById('ngMode').value = gameMode;
                document.getElementById('ngColor').value = playerColor;
                document.getElementById('ngDifficulty').value = aiDifficulty;
                document.getElementById('ngBoardTheme').value = boardTheme;
                const timerVal = timerMode.initial + '|' + timerMode.increment;
                const timerMap = { '600|0': '10|0', '300|3': '5|3', '180|2': '3|2', '60|0': '1|0', '0|0': '0|0' };
                document.getElementById('ngTimer').value = timerMap[timerVal] || '10|0';
            }

            function startNewGame() {
                const mode = document.getElementById('ngMode').value;
                const color = document.getElementById('ngColor').value;
                const difficulty = document.getElementById('ngDifficulty').value;
                const timerStr = document.getElementById('ngTimer').value;
                const theme = document.getElementById('ngBoardTheme').value;
                const [initial, increment] = timerStr.split('|').map(Number);

                gameMode = mode;
                playerColor = color;
                aiDifficulty = difficulty;
                timerMode = { initial: initial * 60, increment };
                boardTheme = theme;
                document.body.setAttribute('data-board-theme', boardTheme);
                timers = { white: timerMode.initial, black: timerMode.initial };

                hideModal('newGameModal');
                resetGame();
                saveSettings();
                renderBoard();
                updateTimerUI();
                if (timerMode.initial > 0) startTimer();
                showToast('Permainan baru dimulai!', 'success');
            }

            function showSettingsModal() {
                const grid = document.getElementById('settingsGrid');
                grid.innerHTML = `
                    <label>Theme</label><select id="setTheme"><option value="dark"${document.documentElement.getAttribute('data-theme')==='dark'?' selected':''}>Dark</option><option value="light"${document.documentElement.getAttribute('data-theme')==='light'?' selected':''}>Light</option></select>
                    <label>Tema Papan</label><select id="setBoardTheme">${['classic','emerald','midnight','rose','bw','neon'].map(t=>`<option value="${t}"${boardTheme===t?' selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}</select>
                    <label>Koordinat</label><select id="setCoords"><option value="1"${showCoordinates?' selected':''}>Ya</option><option value="0"${!showCoordinates?' selected':''}>Tidak</option></select>
                    <label>Volume Suara</label><input type="range" id="setVolume" min="0" max="100" value="${Math.round(soundVolume*100)}">
                `;
                document.getElementById('settingsModal').classList.remove('hidden');
            }

            function saveSettingsFromModal() {
                const theme = document.getElementById('setTheme').value;
                const bt = document.getElementById('setBoardTheme').value;
                const coords = document.getElementById('setCoords').value === '1';
                const vol = parseInt(document.getElementById('setVolume').value) / 100;

                document.documentElement.setAttribute('data-theme', theme);
                boardTheme = bt;
                document.body.setAttribute('data-board-theme', bt);
                showCoordinates = coords;
                soundVolume = vol;
                saveSettings();
                hideModal('settingsModal');
                renderBoard();
                showToast('Pengaturan disimpan!', 'success');
            }

            function updateSoundButton() {
                document.getElementById('btnSoundToggle').textContent = soundEnabled ? '🔊 Sound' : '🔇 Mute';
            }

            // ========== EVENT LISTENERS ==========
            document.getElementById('btnFlip').addEventListener('click', () => {
                boardOrientation = boardOrientation === 'white' ? 'black' : 'white';
                renderBoard();
                saveGameToStorage();
            });
            document.getElementById('btnUndo').addEventListener('click', undoMove);
            document.getElementById('btnRedo').addEventListener('click', redoMove);
            document.getElementById('btnResign').addEventListener('click', () => {
                if (confirm('Apakah Anda yakin ingin menyerah?')) {
                    gameState.gameOver = true;
                    gameState.gameResult = gameState.currentPlayer === 'white' ? 'black' : 'white';
                    stopTimer();
                    updateGameStatus();
                    renderBoard();
                    updatePlayerStatusUI();
                    handleGameOver();
                }
            });
            document.getElementById('btnDraw').addEventListener('click', () => {
                if (confirm('Tawarkan remis?')) {
                    gameState.gameOver = true;
                    gameState.gameResult = 'draw';
                    stopTimer();
                    updateGameStatus();
                    renderBoard();
                    updatePlayerStatusUI();
                    handleGameOver();
                }
            });
            document.getElementById('btnNewGame').addEventListener('click', showNewGameModal);
            document.getElementById('btnSettings').addEventListener('click', showSettingsModal);
            document.getElementById('btnTheme').addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
                saveSettings();
            });
            document.getElementById('btnImportFEN').addEventListener('click', () => document.getElementById('fenModal')
                .classList.remove('hidden'));
            document.getElementById('btnExportFEN').addEventListener('click', () => {
                const fen = exportFEN();
                navigator.clipboard.writeText(fen).then(() => showToast('FEN berhasil disalin!', 'success'))
                    .catch(() => showToast('Gagal menyalin FEN', 'error'));
            });
            document.getElementById('btnSoundToggle').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                updateSoundButton();
                saveSettings();
                showToast(soundEnabled ? 'Suara aktif' : 'Suara nonaktif', 'success');
            });
            document.getElementById('btnCopyPGN').addEventListener('click', copyPGN);
            document.getElementById('btnDownloadPGN').addEventListener('click', downloadPGN);
            document.getElementById('btnStartGame').addEventListener('click', startNewGame);
            document.getElementById('btnCancelNewGame').addEventListener('click', () => hideModal('newGameModal'));
            document.getElementById('btnSaveSettings').addEventListener('click', saveSettingsFromModal);
            document.getElementById('btnCloseSettings').addEventListener('click', () => hideModal('settingsModal'));
            document.getElementById('btnLoadFEN').addEventListener('click', () => {
                const fen = document.getElementById('fenInput').value.trim();
                if (!fen) { showToast('Masukkan FEN string', 'error'); return; }
                try {
                    loadFromFEN(fen);
                    hideModal('fenModal');
                    showToast('FEN berhasil dimuat!', 'success');
                    saveGameToStorage();
                } catch (e) {
                    showToast('FEN tidak valid', 'error');
                }
            });
            document.getElementById('btnCloseFEN').addEventListener('click', () => hideModal('fenModal'));

            // Close modals with Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay:not(.hidden)').forEach(m => m.classList.add(
                        'hidden'));
                    if (pendingPromotionMove) {
                        // Auto-promote to queen on escape
                        promotePawn(pendingPromotionMove, 'queen');
                        pendingPromotionMove = null;
                        hideModal('promotionModal');
                        finalizeMove();
                    }
                }
            });

            // Close modals on overlay click
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.classList.add('hidden');
                });
            });

            // ========== INIT ==========
            function init() {
                loadSettings();
                updateSoundButton();
                document.body.setAttribute('data-board-theme', boardTheme);
                const loaded = loadGameFromStorage();
                if (!loaded) {
                    loadFromFEN(INITIAL_FEN);
                    timers = { white: timerMode.initial, black: timerMode.initial };
                }
                renderBoard();
                updateMoveHistoryUI();
                updateCapturedUI();
                updatePlayerStatusUI();
                updateTimerUI();
                if (timerMode.initial > 0 && !gameState.gameOver) startTimer();
                if (gameMode === 'pvc' && playerColor === 'black' && !gameState.gameOver && gameState.moveHistory
                    .length === 0) {
                    setTimeout(() => makeComputerMove(), 500);
                }
            }

            init();
            console.log('♟️ Catur Modern siap dimainkan!');
            console.log('Fitur: PvP, PvC AI, Timer, Undo/Redo, FEN/PGN, Tema, Suara, Drag & Drop, Touch');
        })();
    </script>
</body>
</html>
